version: "3.9"

services:
  mysql:
    image: mysql:8.4
    container_name: entradasegura-mysql
    command: --log-bin-trust-function-creators=1
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-entradasegura}
      MYSQL_USER: ${DB_USERNAME:-entradasegura}
      MYSQL_PASSWORD: ${DB_PASSWORD:-entradasegura}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpass}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: entradasegura-backend
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    environment:
      APP_PROFILE: ${APP_PROFILE:-dev}
      DB_URL: jdbc:mysql://mysql:3306/${DB_NAME:-entradasegura}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: ${DB_USERNAME:-entradasegura}
      DB_PASSWORD: ${DB_PASSWORD:-entradasegura}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_ACCESS_TOKEN_EXPIRATION_MS: ${JWT_ACCESS_TOKEN_EXPIRATION_MS:-900000}
      JWT_REFRESH_TOKEN_EXPIRATION_MS: ${JWT_REFRESH_TOKEN_EXPIRATION_MS:-604800000}
      QR_EXPIRATION_MINUTES: ${QR_EXPIRATION_MINUTES:-15}
      SERVER_PORT: ${SERVER_PORT:-8080}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  mysql_data:
